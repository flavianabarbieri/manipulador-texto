<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manipulador de Texto & SQL</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(
        135deg,
        #006B6F 0%,
        #00565A 50%,
        #00494C 100%
    );
    margin:0;
    padding:40px;
    min-height:100vh;
}

.container{
    max-width:900px;
    margin:auto;
    background:#DDF9D1;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.logo-unimed{
    width:220px;
    margin:0 auto 25px auto;
    background:#00995D;
    color:white;
    text-align:center;
    padding:18px;
    border-radius:18px;
    font-size:42px;
    font-weight:bold;
    border:2px solid white;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.logo-container{
    text-align:center;
    margin-bottom:20px;
}

.logo-container img{
    width:240px;
    height:auto;
}

h1{
    text-align:center;
    color:#006B3F;
    margin-bottom:25px;
    font-size:38px;
}

textarea{
    width:100%;
    height:220px;
    padding:15px;
    border:1px solid #cfd6df;
    border-radius:8px;
    resize:vertical;
    font-size:16px;
    box-sizing:border-box;
}

.botoes{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    border:none;
    padding:12px;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.azul{
    background:#014D4B;
}

.azul:hover{
    background:#00565A;
}

.verde{
    background:#00995D;
}

.verde:hover{
    background:#007A4A;
}

.roxo{
    background:#006B3F;
}

.roxo:hover{
    background:#005332;
}

.laranja{
    background:#7bd480;
}

.laranja:hover{
    background:#73e0a0;
}

.vermelho{
    background:#02551b;
}

.vermelho:hover{
    background:#68f0a1;
}
.info{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    color:#666;
}
</style>
</head>
<body>

<div class="container">

    <div class="logo-container">
    <img src="./logo-unimed.png" alt="Unimed Londrina">
</div>


    <h1>Manipulador de Texto & SQL</h1>

    <textarea id="texto"   placeholder="Dica: Cole uma lista de nomes ou valores separados por linha ou espaço."></textarea>

      <div class="botoes">

        <button class="vermelho" onclick="maiusculas()">MAIÚSCULAS</button>

        <button class="azul" onclick="minusculas()">MINÚSCULAS</button>

        <button class="laranja" onclick="titulo()">TÍTULO</button>

        <button class="verde" onclick="removerAcentos()">
            REMOVER ACENTOS
        </button>

        <button class="laranja" onclick="removerPontuacao()">
            REMOVER . E -
        </button>

        <button class="roxo" onclick="sqlListaIn()">
            SQL (LISTA IN)
        </button>

        <button class="azul" onclick="sqlAlias()">
            SQL (COM ALIAS)
        </button>

        <button class="roxo" onclick="copiarTexto()">
            COPIAR TEXTO
        </button>

       <button class="verde" onclick="gerarIniciais()">
    FORMATAR NOME
</button>
        <button class="azul" onclick="formatarFrase()">
    FORMATAR FRASE
</button>

        <button class="vermelho" onclick="limpar()">
            LIMPAR
        </button>

    </div>

    <div class="info">
        <span id="contador">Caracteres: 0</span>
        <span id="status">Status: Pronto</span>
    </div>

</div>

<script>

const texto = document.getElementById("texto");

texto.addEventListener("input", atualizarContador);

function atualizarContador(){
    document.getElementById("contador").innerText =
    "Caracteres: " + texto.value.length;
}

function setStatus(msg){
    document.getElementById("status").innerText =
    "Status: " + msg;
}

function maiusculas(){
    texto.value = texto.value.toUpperCase();
    atualizarContador();
    setStatus("Convertido para MAIÚSCULAS");
}

function minusculas(){
    texto.value = texto.value.toLowerCase();
    atualizarContador();
    setStatus("Convertido para minúsculas");
}

function titulo(){

    texto.value = texto.value
    .toLowerCase()
    .replace(/\b\w/g, letra => letra.toUpperCase());

    setStatus("Convertido para título");
}

function removerAcentos() {

    let valor = texto.value
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    if (/^[0-9.\-\/\s]+$/.test(valor.trim())) {
        valor = valor.replace(/[.\-\/\s]/g, "");
    }

    texto.value = valor;

    setStatus("Processamento concluído");
}

function removerPontuacao(){

    texto.value = texto.value.replace(/[.-]/g,'');

    setStatus("Pontos e hífens removidos");
}

function sqlListaIn(){

    let lista = texto.value
    .split(/\s+/)
    .filter(item => item.trim() !== '');

    texto.value =
    "IN (\n'" +
    lista.join("',\n'") +
    "'\n)";

    setStatus("SQL IN gerado");
}

function sqlAlias(){

    let lista = texto.value
    .split(/\s+/)
    .filter(item => item.trim() !== '');

    texto.value = lista
    .map(item => `'${item}' AS ${item}`)
    .join(",\n");

    setStatus("SQL Alias gerado");
}

async function copiarTexto(){

    await navigator.clipboard.writeText(texto.value);

    setStatus("Texto copiado");
}

function limpar(){
    texto.value = "";
    atualizarContador();
    setStatus("Limpo");
}

function setStatus(msg) {
    document.getElementById("status").innerText =
        "Status: " + msg;
}

function gerarIniciais() {

    const excecoes = ["de", "da", "do", "das", "dos", "e"];

    const palavras = texto.value
        .trim()
        .toLowerCase()
        .split(/\s+/);

    const resultado = palavras.map((palavra, indice) => {

        if (indice > 0 && excecoes.includes(palavra)) {
            return palavra;
        }

        return palavra.charAt(0).toUpperCase() + palavra.slice(1);
    });

    texto.value = resultado.join(" ");

    setStatus("Nome formatado");
}

function formatarFrase() {

    let linhas = texto.value.split('\n');

    linhas = linhas.map(linha => {

        linha = linha.trim();

        if (linha.length === 0) {
            return "";
        }

        return linha.charAt(0).toUpperCase() +
               linha.slice(1).toLowerCase();
    });

    texto.value = linhas.join('\n');

    setStatus("Frases formatadas");
}

</script>
</body>
</html>
