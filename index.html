<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manipulador de Texto & SQL</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#e9edf2;
    margin:0;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#24344d;
    margin-bottom:25px;
}

textarea{
    width:100%;
    height:220px;
    padding:15px;
    border:1px solid #cfd6df;
    border-radius:8px;
    resize:vertical;
    font-size:16px;
    box-sizing:border-box;
}

.botoes{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    border:none;
    padding:12px;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.azul{
    background:#4b556d;
}

.laranja{
    background:#f08a3e;
}

.roxo{
    background:#8754d6;
}

.verde{
    background:#0ca56d;
}

.vermelho{
    background:#f44336;
}

.verde{
    background:#0ca56d;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    color:#666;
}
</style>
</head>
<body>

<div class="container">

    <h1>Manipulador de Texto & SQL</h1>

    <textarea id="texto"
    placeholder="Dica: Cole uma lista de nomes ou valores separados por linha ou espaço..."></textarea>

      <div class="botoes">

        <button class="vermelho" onclick="maiusculas()">MAIÚSCULAS</button>

        <button class="azul" onclick="minusculas()">MINÚSCULAS</button>

        <button class="laranja" onclick="titulo()">TÍTULO</button>

        <button class="verde" onclick="removerAcentos()">
            REMOVER ACENTOS
        </button>

        <button class="laranja" onclick="removerPontuacao()">
            REMOVER . E -
        </button>

        <button class="roxo" onclick="sqlListaIn()">
            SQL (LISTA IN)
        </button>

        <button class="azul" onclick="sqlAlias()">
            SQL (COM ALIAS)
        </button>

        <button class="roxo" onclick="copiarTexto()">
            COPIAR TEXTO
        </button>

       <button class="verde" onclick="gerarIniciais()">
    FORMATAR NOME
</button>

        <button class="vermelho" onclick="limpar()">
            LIMPAR
        </button>

    </div>

    <div class="info">
        <span id="contador">Caracteres: 0</span>
        <span id="status">Status: Pronto</span>
    </div>

</div>

<script>

const texto = document.getElementById("texto");

texto.addEventListener("input", atualizarContador);

function atualizarContador(){
    document.getElementById("contador").innerText =
    "Caracteres: " + texto.value.length;
}

function setStatus(msg){
    document.getElementById("status").innerText =
    "Status: " + msg;
}

function maiusculas(){
    texto.value = texto.value.toUpperCase();
    atualizarContador();
    setStatus("Convertido para MAIÚSCULAS");
}

function minusculas(){
    texto.value = texto.value.toLowerCase();
    atualizarContador();
    setStatus("Convertido para minúsculas");
}

function titulo(){

    texto.value = texto.value
    .toLowerCase()
    .replace(/\b\w/g, letra => letra.toUpperCase());

    setStatus("Convertido para título");
}

function removerAcentos() {

    let valor = texto.value
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    if (/^[0-9.\-\/\s]+$/.test(valor.trim())) {
        valor = valor.replace(/[.\-\/\s]/g, "");
    }

    texto.value = valor;

    setStatus("Processamento concluído");
}

function removerPontuacao(){

    texto.value = texto.value.replace(/[.-]/g,'');

    setStatus("Pontos e hífens removidos");
}

function sqlListaIn(){

    let lista = texto.value
    .split(/\s+/)
    .filter(item => item.trim() !== '');

    texto.value =
    "IN (\n'" +
    lista.join("',\n'") +
    "'\n)";

    setStatus("SQL IN gerado");
}

function sqlAlias(){

    let lista = texto.value
    .split(/\s+/)
    .filter(item => item.trim() !== '');

    texto.value = lista
    .map(item => `'${item}' AS ${item}`)
    .join(",\n");

    setStatus("SQL Alias gerado");
}

async function copiarTexto(){

    await navigator.clipboard.writeText(texto.value);

    setStatus("Texto copiado");
}

function limpar(){
    texto.value = "";
    atualizarContador();
    setStatus("Limpo");
}

function setStatus(msg) {
    document.getElementById("status").innerText =
        "Status: " + msg;
}

function gerarIniciais() {

    const excecoes = ["de", "da", "do", "das", "dos", "e"];

    const palavras = texto.value
        .trim()
        .toLowerCase()
        .split(/\s+/);

    const resultado = palavras.map((palavra, indice) => {

        if (indice > 0 && excecoes.includes(palavra)) {
            return palavra;
        }

        return palavra.charAt(0).toUpperCase() + palavra.slice(1);
    });

    texto.value = resultado.join(" ");

    setStatus("Nome formatado");
}
</script>
</body>
</html>
